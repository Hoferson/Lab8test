name: TMS CI Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  MIN_COVERAGE: 75

jobs:
  lint:
    name: 'Lint & Static Analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install tools
        run: pip install flake8 pylint mypy bandit
      - name: Run flake8
        run: flake8 src/ --max-line-length=100
      - name: Run pylint
        run: pylint src/ --fail-under=7.0

  test:
    name: 'Tests & Coverage'
    needs: lint  # Запустится только если lint прошел успешно
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest --cov=src --cov-fail-under=${{ env.MIN_COVERAGE }}

  security:
    name: 'Security Scan'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bandit
        run: pip install bandit && bandit -r src/ -ll