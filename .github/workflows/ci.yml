name: TMS CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  MIN_COVERAGE: 75

jobs:
  lint:
    name: 'Static Analysis (Lint)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies and tools
        run: |
          pip install -r requirements.txt
          pip install flake8 pylint mypy bandit
      - name: Run flake8
        run: flake8 src/ --max-line-length=100
      - name: Run pylint
        run: pylint src/ --fail-under=7.0

  test:
    name: 'Tests & Coverage'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        run: |
          # Створюємо порожній тест, щоб pytest не падав, якщо папка порожня
          mkdir -p tests
          echo "def test_health(): assert True" > tests/test_placeholder.py
          pytest --cov=src --cov-fail-under=${{ env.MIN_COVERAGE }}

  security:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: bandit -r src/ -ll